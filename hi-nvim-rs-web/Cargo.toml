[package]
name = "hi-nvim-rs-web"
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false 

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["form", "query"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
clap = { version = "4.3", features = ["derive"] }
hi-nvim-rs-web-styler = { path = "../hi-nvim-rs-web-styler" }
markup = { version = "0.16" }
mime = "0.3"
pin-project = "1.1.2"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "macros", "net"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-full", "timeout"] }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
hi-nvim-rs = { path = "../" }
hi-nvim-rs-web-styler = { path = "../hi-nvim-rs-web-styler" }
itertools = "0.15"
tree-sitter-highlight = "0.27"

tree-sitter-c = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
